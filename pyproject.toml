[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrs-ai"
version = "0.1.0"
description = "Prepare-only AI-assisted Jira bug workflow prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hrs-ai = "hrs_ai.cli:main"

[tool.setuptools.packages.find]
include = ["hrs_ai*"]
